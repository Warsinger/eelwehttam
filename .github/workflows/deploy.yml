name: Deploy website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this revision (main production; previews require preview_pr)
        type: boolean
        default: false
      catalog:
        description: Publish catalog data (main production; previews require preview_pr)
        type: boolean
        default: false
      setup_catalog:
        description: Create the approved free catalog Pages project if missing
        type: boolean
        default: false
      preview_pr:
        description: Open same-repository PR number for manual preview
        type: string
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.paths.outputs.site }}
      catalog: ${{ steps.paths.outputs.catalog }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test catalog and classify changed paths
        id: paths
        run: |
          node --test scripts/*.test.mjs
          node scripts/changed-paths.mjs
  build:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/check-site.mjs
      - name: Prepare static artifact and revision
        env:
          PREVIEW_PR: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.preview_pr || '' }}
        run: node scripts/build-site.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: landing-page-web
          path: build/pages
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    uses: Warsinger/cloudflare-pages-deploy/.github/workflows/pages.yml@8c5e23604919f8d049d0a8630c61827e409f5304
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    with:
      deployment-ref: 8c5e23604919f8d049d0a8630c61827e409f5304
      artifact-name: landing-page-web
      project-name: eelwehttam
      hostname: eelwehttam.pages.dev
      title: Applications and projects
      preview-pr: ${{ inputs.preview_pr }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  verify-published:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify published assets match this revision
        env:
          PREVIEW_PR: ${{ github.ref != 'refs/heads/main' && inputs.preview_pr || '' }}
          SITE_URL: ${{ github.ref == 'refs/heads/main' && 'https://eelwehttam.pages.dev' || format('https://pr-{0}.eelwehttam.pages.dev', inputs.preview_pr) }}
        run: |
          node scripts/build-site.mjs
          node scripts/check-live.mjs
  catalog-build:
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/build-catalog.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: application-catalog
          path: build/catalog
          if-no-files-found: error
          retention-days: 14
  setup-catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.setup_catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/setup-catalog.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  catalog-deploy:
    needs: [catalog-build, setup-catalog]
    if: always() && needs.catalog-build.result == 'success' && (needs.setup-catalog.result == 'success' || needs.setup-catalog.result == 'skipped') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.catalog))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-${{ github.repository }}-vanity-app-catalog
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PREVIEW_PR: ${{ inputs.preview_pr }}
      PAGES_PROJECT: vanity-app-catalog
      PAGES_HOSTNAME: vanity-app-catalog.pages.dev
      PAGES_TITLE: Application catalog
      PAGES_COMMENT_MARKER: '<!-- application-catalog-preview -->'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Warsinger/cloudflare-pages-deploy
          ref: 8c5e23604919f8d049d0a8630c61827e409f5304
          path: deployment-tools
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: application-catalog
          path: build/pages
      - name: Validate target, source and artifact with shared tooling
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deployment-tools/scripts/deploy-pages.mjs validate
      - name: Recheck retained images against the current published catalog
        run: node scripts/changed-paths.mjs --catalog-guard
      - name: Publish through shared upload action
        uses: Warsinger/cloudflare-pages-deploy/upload@8ed38d395ac53e4d2172f0ad18e4b7fe0abfd014
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}
          command: pages deploy build/pages --project-name vanity-app-catalog --branch ${{ steps.target.outputs.branch }} --commit-hash ${{ github.sha }} --commit-dirty=false
      - name: Update preview comment with shared tooling
        run: node deployment-tools/scripts/deploy-pages.mjs comment
